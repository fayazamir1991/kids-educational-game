apply plugin: 'com.android.application'

def releaseEnvironment = [
    'ANDROID_RELEASE_STORE_FILE', 'ANDROID_RELEASE_STORE_PASSWORD',
    'ANDROID_RELEASE_KEY_ALIAS', 'ANDROID_RELEASE_KEY_PASSWORD'
].collectEntries { name -> [(name): System.getenv(name)] }
def hasReleaseSigning = releaseEnvironment.values().every { value -> value != null && !value.isEmpty() }
if (releaseEnvironment.values().any { value -> value != null && !value.isEmpty() } && !hasReleaseSigning) {
    throw new GradleException('Set all four ANDROID_RELEASE_* signing variables or leave all unset for unsigned release outputs.')
}

android {
    namespace = "com.fayazamir.kidsgarden"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.fayazamir.kidsgarden"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode Integer.parseInt(System.getenv('APP_VERSION_CODE') ?: '1')
        versionName System.getenv('APP_VERSION_NAME') ?: '1.0.0'
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    buildFeatures {
        buildConfig true
    }
    signingConfigs {
        if (System.getenv('ANDROID_USER_HOME')) {
            debug {
                storeFile file(System.getenv('ANDROID_USER_HOME') + '/debug.keystore')
            }
        }
        if (hasReleaseSigning) {
            release {
                storeFile file(releaseEnvironment['ANDROID_RELEASE_STORE_FILE'])
                storePassword releaseEnvironment['ANDROID_RELEASE_STORE_PASSWORD']
                keyAlias releaseEnvironment['ANDROID_RELEASE_KEY_ALIAS']
                keyPassword releaseEnvironment['ANDROID_RELEASE_KEY_PASSWORD']
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (hasReleaseSigning) signingConfig signingConfigs.release
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    // Explicit compile dependency for our manifest override of its optional emoji initializer.
    implementation "androidx.startup:startup-runtime:1.1.1"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'
